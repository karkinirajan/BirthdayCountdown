<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Birthday Countdown | Nirajan Karki</title>
    <link rel="stylesheet" href="style.css" />
    <script defer src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.4/dist/confetti.browser.min.js" integrity="sha384-JSZXO0kKYHTylAsDYTb+7Kg2eUyalm19b8Pydcdf8sQ1cCKYZr9lLahoKT9+LFY5" crossorigin="anonymous"></script>
    <script type="module" src="script.js"></script>
  </head>
  <body>
    <div class="container">
      <header>
        <h1 id="greeting">
          Namaste! I am <span class="highlight-name">Nirajan Karki</span>
        </h1>
        <p class="wish-me-at" id="subtext">Calculating the next birthday…</p>
      </header>

      <main>
        <div class="countdown" id="countdown" role="timer" aria-live="off">
          <div class="time-box">
            <span class="number" id="days">00</span>
            <span class="label">Days</span>
          </div>
          <div class="time-box">
            <span class="number" id="hours">00</span>
            <span class="label">Hours</span>
          </div>
          <div class="time-box">
            <span class="number" id="mins">00</span>
            <span class="label">Mins</span>
          </div>
          <div class="time-box">
            <span class="number" id="secs">00</span>
            <span class="label">Secs</span>
          </div>
        </div>
        <div class="celebration-message" id="celebration" role="status" aria-live="polite">
          🎉 Happy Birthday! 🎂
        </div>
      </main>

      <footer>
        <p>Thank you for visiting! See you on birthday !!</p>
      </footer>
    </div>

  </body>
</html>
